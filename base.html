<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Herd — Global Unicorn Ledger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="topbar">
    <span class="brand-mark">herd</span>
    <div class="topbar-nav">
      <a href="{{ url_for('index') }}" class="{{ 'active' if active=='home' }}">Overview</a>
      <a href="{{ url_for('explore') }}" class="{{ 'active' if active=='explore' }}">Explore</a>
      <a href="{{ url_for('analytics') }}" class="{{ 'active' if active=='analytics' }}">Analytics</a>
      <a href="{{ url_for('compare') }}" class="{{ 'active' if active=='compare' }}">Compare</a>
      <a href="{{ url_for('insights') }}" class="{{ 'active' if active=='insights' }}">Insights</a>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">herd</span>
        <span class="brand-tag">UNICORN LEDGER</span>
      </div>
      <nav class="nav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if active=='home' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
          Overview
        </a>
        <a href="{{ url_for('explore') }}" class="{{ 'active' if active=='explore' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          Explore
        </a>
        <a href="{{ url_for('analytics') }}" class="{{ 'active' if active=='analytics' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Analytics
        </a>
        <a href="{{ url_for('compare') }}" class="{{ 'active' if active=='compare' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4v16M16 4v16M4 8h8M12 16h8"/></svg>
          Compare
        </a>
        <a href="{{ url_for('insights') }}" class="{{ 'active' if active=='insights' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg>
          Insights
        </a>
      </nav>
      <div class="sidebar-foot">
        {{ "{:,}".format(site.total) }} companies tracked<br>
        {{ site.first_year }} – {{ site.last_year }}
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
